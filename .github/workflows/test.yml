name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify zero dependencies
        run: |
          if [ -d "node_modules" ]; then
            echo "node_modules exists — this should never happen for a zero-dependency project"
            exit 1
          fi
          echo "Confirmed: no node_modules directory"

      - name: Run tests
        run: node --test